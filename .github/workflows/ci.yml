name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: urlix
          POSTGRES_PASSWORD: urlix
          POSTGRES_DB: urlix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlix -d urlix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migrations
        run: |
          PGPASSWORD=urlix psql \
            -h localhost \
            -U urlix \
            -d urlix \
            -f migrations/001_create_urls.sql

          PGPASSWORD=urlix psql \
            -h localhost \
            -U urlix \
            -d urlix \
            -f migrations/002_add_click_count.sql

          PGPASSWORD=urlix psql \
            -h localhost \
            -U urlix \
            -d urlix \
            -f migrations/003_add_expires_at.sql

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
